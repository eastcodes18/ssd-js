<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
</head>
<body>
    <button onclick="console.log(`Cart Quantity : ${cartQuantity}`);">Show Quantity</button>
    <button onclick="
        cartQuantity++;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">Add to cart</button>
    <button onclick="
        cartQuantity += 2;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">+2</button>
    <button onclick="
        cartQuantity += 3;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">+3</button>
    <button onclick="
        cartQuantity += 4;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">+4</button>
    <button onclick="
        cartQuantity += 5;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">+5</button>
    <button onclick="
        cartQuantity = 0;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">Reset Quantity</button>
    <button onclick="
        cartQuantity--;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">Remove from cart</button>
    <button onclick="
        cartQuantity -= 2;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">-2</button>
    <button onclick="
        cartQuantity -= 3;
        console.log(`Cart Quantity : ${cartQuantity}`);
    ">-3</button>

        console.log(`cost: ${cost}`);

        const tax = cost * 0.1;
        console.log(`tax(10%): $${tax}`);

        const totalCost = cost + tax;
        console.log(`Total cost: $${totalCost}`);

        let cartQuantity = 0;


    </script>
</body>
</html>
