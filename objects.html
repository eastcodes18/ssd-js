<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    <script>
        const product = {
            'name': 'Shoes',
            'price': '1500'
        };

        console.log(product);
        console.log(typeof product);
        console.log(product.name);
        console.log(product.price);

        product.size = 8;
        console.log(product);
        

        delete product.size;
        console.log(product);
    </script>
</body>
</html>
