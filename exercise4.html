<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution 4: Buttons</title>
    <style>
        .yellow-btn{
            background-color: yellow;
        }

        .orange-btn{
            background-color: orange;
        }
    </style>
</head>
<body>
    <div>
        <button>Click</button>
        <hr>
        <button>Prachi</button>
        <button>Pizza</button>
        <p>Hello, world!</p>
        <p>Today I went to the office.</p>
        <button class="btn yellow-btn">Add to cart</button>
        <button class="btn orange-btn">Buy now</button>
    </div>

    <div>
        <p>Adults Plain cotton T-shirt</p>
        <p>Price: $7.99</p>
        <button class="btn yellow-btn" onclick="alert('Added..!')">Add to cart</button>
        <button class="btn orange-btn" onclick="console.log('Loading..'); alert('Purchased!')">Buy now</button>
    </div>
    <script>
        console.log('Welcome!');
    </script>
</body>
</html>
